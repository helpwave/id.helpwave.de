name: ci
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven
            - uses: bahmutov/npm-install@v1
            - run: npm run check-translations
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build-keycloak-theme
            - name: Build Keycloak SPIs
              working-directory: keycloak-extensions
              run: mvn -B -DskipTests package

    check_if_version_upgraded:
        name: Check if version upgrade
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: test
        outputs:
            from_version: ${{ steps.step1.outputs.from_version }}
            to_version: ${{ steps.step1.outputs.to_version }}
            is_upgraded_version: ${{ steps.step1.outputs.is_upgraded_version }}
            is_pre_release: ${{steps.step1.outputs.is_pre_release }}
        steps:
            - uses: garronej/ts-ci@v2.1.5
              id: step1
              with:
                  action_name: is_package_json_version_upgraded
                  branch: ${{ github.head_ref || github.ref }}

    create_github_release:
        runs-on: ubuntu-latest
        needs: check_if_version_upgraded
        if: needs.check_if_version_upgraded.outputs.is_upgraded_version == 'true'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven
            - uses: bahmutov/npm-install@v1
            - run: npm run build-keycloak-theme
            - name: Build Keycloak SPIs
              working-directory: keycloak-extensions
              run: mvn -B -DskipTests package
            - name: Collect release artifacts
              run: |
                  mkdir -p release-artifacts
                  cp dist_keycloak/keycloak-theme-*.jar release-artifacts/
                  cp keycloak-extensions/captcha/target/helpwave-captcha-*.jar release-artifacts/
                  cp keycloak-extensions/policy-acceptance/target/helpwave-policy-acceptance-*.jar release-artifacts/
                  cp keycloak-extensions/picture/target/helpwave-picture-*.jar release-artifacts/
                  rm -f release-artifacts/original-*.jar
            - uses: softprops/action-gh-release@v2
              with:
                  name: Release v${{ needs.check_if_version_upgraded.outputs.to_version }}
                  tag_name: v${{ needs.check_if_version_upgraded.outputs.to_version }}
                  target_commitish: ${{ github.head_ref || github.ref }}
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ needs.check_if_version_upgraded.outputs.is_pre_release == 'true' }}
                  files: release-artifacts/*.jar
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    update_nixos_plugin_pins:
        name: Update NixOS plugin pins in docs
        runs-on: ubuntu-latest
        needs: [check_if_version_upgraded, create_github_release]
        if: needs.check_if_version_upgraded.outputs.is_pre_release != 'true'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
            - uses: actions/setup-node@v4
            - name: Re-pin docs/deployment-nixos.md to the new release
              run: node scripts/update-nixos-plugin-pins.mjs --tag v${{ needs.check_if_version_upgraded.outputs.to_version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Commit and push updated pins
              run: |
                  if git diff --quiet docs/deployment-nixos.md; then
                      echo "Pins already up to date, nothing to commit."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add docs/deployment-nixos.md
                  git commit -m "docs: pin NixOS plugins to v${{ needs.check_if_version_upgraded.outputs.to_version }}"
                  git push origin main
